server:
  port: 8080

spring:
  application:
    name: teriak-plan-de-charge
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # SQLite persistence
  datasource:
    url: ${DB_URL:jdbc:sqlite:./data/teriak.db?journal_mode=WAL&busy_timeout=5000&synchronous=NORMAL}
    driver-class-name: org.sqlite.JDBC
    hikari:
      maximum-pool-size: 1
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: 5000
      max-lifetime: 0
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    properties:
      hibernate:
        show_sql: false
        format_sql: false
    open-in-view: false

# Ollama connection (used directly via RestTemplate in AiAssistantService)
ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  model: ${OLLAMA_MODEL:llama3}

# Timefold Solver
timefold:
  solver:
    termination:
      spent-limit: 30s
    environment-mode: FAST_ASSERT

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.teriak: INFO
    ai.timefold: WARN
