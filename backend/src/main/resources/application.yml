server:
  port: 8080

spring:
  application:
    name: teriak-plan-de-charge
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

# LangChain4j Ollama
langchain4j:
  ollama:
    base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
    model-name: ${OLLAMA_MODEL:llama3}
    timeout: 120s
    temperature: 0.3
    log-requests: false
    log-responses: false

# Timefold Solver
timefold:
  solver:
    termination:
      spent-limit: 30s
    environment-mode: FAST_ASSERT

# CORS
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.teriak: INFO
    ai.timefold: WARN
    dev.langchain4j: WARN
