services:
  # ── Ollama (Local LLM — Offline First) ──────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: teriak-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    # GPU support (uncomment if NVIDIA GPU available)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # ── Pull Llama 3 model on first start ────────────────────────────────────
  # Retries until Ollama is ready — no healthcheck dependency needed
  ollama-pull:
    image: ollama/ollama:latest
    container_name: teriak-ollama-pull
    depends_on:
      - ollama
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo "Waiting for Ollama to be ready..."
        until curl -sf http://ollama:11434/api/tags > /dev/null 2>&1; do
          sleep 3
        done
        echo "Ollama is ready. Pulling llama3..."
        ollama pull llama3
        echo "Done."
    environment:
      - OLLAMA_HOST=http://ollama:11434
    restart: "no"

  # ── Spring Boot Backend ───────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teriak-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000,http://frontend
      - SERVER_PORT=8080
    # Backend does NOT depend on Ollama health — the AI assistant has a local fallback
    healthcheck:
      # eclipse-temurin Alpine image has wget but not curl
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/pdp/health > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── React Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: teriak-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  ollama_data:
    name: teriak_ollama_models

networks:
  default:
    name: teriak-network
